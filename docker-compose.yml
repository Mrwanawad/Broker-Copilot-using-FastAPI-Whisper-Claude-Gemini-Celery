name: broker-copilot

x-app: &app
  build: .
  image: broker-copilot:local
  env_file: .env
  environment: &app-env
    BC_DATABASE_URL: postgresql+psycopg://copilot:copilot@postgres:5432/copilot
    BC_REDIS_URL: redis://redis:6379/0
    BC_UPLOAD_DIR: /app/data/uploads
  volumes:
    - uploads:/app/data/uploads
    - hf-cache:/home/copilot/.cache/huggingface
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]

  worker:
    <<: *app
    command: celery -A app.jobs.worker.celery_app worker -Q calls --concurrency 1 --loglevel INFO

  ui:
    <<: *app
    command: streamlit run ui/review_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      <<: *app-env
      BC_API_URL: http://api:8000
      BC_UI_API_KEY: dev-key
    ports: ["127.0.0.1:8501:8501"]
    depends_on: [api]

volumes:
  pg-data:
  uploads:
  hf-cache:
