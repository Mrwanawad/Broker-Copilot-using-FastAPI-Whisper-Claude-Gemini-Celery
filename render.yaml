envVarGroups:
  - name: broker-copilot-shared
    envVars:
      - key: BC_ASR_BACKEND
        value: faster_whisper
      - key: BC_WHISPER_MODEL
        value: small
      # uploads go to S3-compatible storage so the API and worker share them (R2: set BC_S3_ENDPOINT_URL)
      - key: BC_STORAGE_BACKEND
        value: s3
      - key: BC_S3_BUCKET
        sync: false
      - key: BC_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: BC_API_KEYS
        sync: false

services:
  - type: web
    name: broker-copilot-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - fromGroup: broker-copilot-shared
      - key: BC_DATABASE_URL
        fromDatabase: {name: broker-copilot-db, property: connectionString}
      - key: BC_REDIS_URL
        fromService: {type: redis, name: broker-copilot-redis, property: connectionString}

  - type: worker
    name: broker-copilot-worker
    runtime: docker
    plan: standard
    dockerCommand: celery -A app.jobs.worker.celery_app worker -Q calls --concurrency 1
    envVars:
      - fromGroup: broker-copilot-shared
      - key: BC_DATABASE_URL
        fromDatabase: {name: broker-copilot-db, property: connectionString}
      - key: BC_REDIS_URL
        fromService: {type: redis, name: broker-copilot-redis, property: connectionString}

  - type: redis
    name: broker-copilot-redis
    plan: free
    ipAllowList: []

databases:
  - name: broker-copilot-db
    plan: free
